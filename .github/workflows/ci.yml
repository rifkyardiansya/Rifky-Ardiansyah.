# =====================================================================
#  Continuous Integration
#  Jalankan otomatis setiap push & pull request:
#    typecheck → unit test → production build → smoke test API
# =====================================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit & integration test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Seed database (untuk smoke test)
        run: npm run db:seed

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            dev-server.log
            data/
          retention-days: 7

  smoke:
    name: Smoke Test API (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resto
          POSTGRES_PASSWORD: resto
          POSTGRES_DB: restoran
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

      # Redis untuk rate limiter terpusat & antrean job (Phase 6).
      # Smoke test dijalankan dengan REDIS_URL aktif agar jalur produksi
      # (antrean Redis + worker) ikut terverifikasi, bukan hanya fallback in-memory.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    env:
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build aplikasi
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Start server
        run: |
          npm run db:seed
          npx next start -p 3000 &
          npx wait-on tcp:3000 -t 60000
        env:
          NODE_ENV: production

      # Catatan: worker sengaja TIDAK dijalankan di job smoke ini.
      # Endpoint cron mendeteksi worker hidup lalu membalas 202 (job diantrekan),
      # sedangkan smoke test mengharapkan hasil laporan sinkron. Jalur antrean
      # Redis sendiri sudah diuji penuh oleh `tests/phase6.test.ts`.

      - name: Smoke test Phase 1 (modul 1-5)
        run: npm run smoke

      - name: Smoke test Phase 2 (payment, notifikasi, PDF, SSE)
        run: npm run smoke:phase2

      - name: Smoke test Phase 5 (laporan terjadwal & audit log)
        run: npm run smoke:phase5

      - name: Database health check
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee health.json
          node -e "const h=require('./health.json');if(h.status!=='healthy'){console.error('Health check degraded');process.exit(1)}console.log('Health:',h.status)"

      - name: Jurnal akuntansi harus seimbang
        run: |
          npm run db:status
          node -e "
            const {execSync}=require('child_process');
            const out=execSync('npm run db:status').toString();
            if(!out.includes('SEIMBANG')){console.error('Jurnal tidak seimbang!');process.exit(1)}
          "

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            health.json
          retention-days: 7

  e2e:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan E2E test (build + server produksi oleh Playwright)
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload laporan E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/restoran-nusantara:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/restoran-nusantara:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Scan image ke Vulnerability DB
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/restoran-nusantara:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true