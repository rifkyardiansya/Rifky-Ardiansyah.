# =====================================================================
#  Nginx — TLS termination, rate limiting, gzip, SSE passthrough.
#  Sesuai blueprint Section 8 (Layer 1: Network / WAF / DDoS).
# =====================================================================

# Batas laju di sisi proxy (pelengkap rate limiter di aplikasi).
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

upstream backend {
    server app:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Ganti dengan sertifikat Let's Encrypt / commercial Anda.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batasi ukuran body (unggahan gambar menu & bukti transfer).
    client_max_body_size 8m;
    limit_conn per_ip 40;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # -----------------------------------------------------------------
    # Halaman statis — di-cache di CDN/proxy
    # -----------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|svg|webp|woff2)$ {
        proxy_pass http://backend;
        add_header Cache-Control "public, max-age=2592000";
    }

    # -----------------------------------------------------------------
    # Realtime (Server-Sent Events) — buffering harus dimatikan
    # -----------------------------------------------------------------
    location /api/v1/events {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # -----------------------------------------------------------------
    # Health check tanpa rate limit & tanpa log
    # -----------------------------------------------------------------
    location = /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # -----------------------------------------------------------------
    # Endpoint autentikasi — rate limit ketat (anti brute-force)
    # -----------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------
    # API umum
    # -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------
    # Halaman aplikasi
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}